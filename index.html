<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jack Coates — Developer &amp; Cyber Security</title>
    <meta name="description" content="Jack Coates — UK-based developer and cyber security student. I build full-stack web apps, security tools, and run a Proxmox homelab. Open to opportunities." />
    <meta name="author" content="Jack Coates" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://jackcoates.co.uk/" />

    <!-- Belt-and-braces alongside the real CSP set via nginx headers (which is
         what actually enforces it — this meta tag is a fallback for anything
         served outside that nginx config, e.g. a local dev preview).
         frame-ancestors/upgrade-insecure-requests are omitted: the CSP spec
         doesn't support them in a meta tag, only the header enforces those. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://ipapi.co https://ipwho.is https://api4.ipify.org https://api6.ipify.org; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'self'; form-action 'self'" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jackcoates.co.uk/" />
    <meta property="og:title" content="Jack Coates — Developer &amp; Cyber Security" />
    <meta property="og:description" content="Jack Coates — UK-based developer and cyber security student. Full-stack web apps, security tools, Proxmox homelab." />
    <meta property="og:site_name" content="Jack Coates" />
    <meta property="og:image" content="https://jackcoates.co.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
