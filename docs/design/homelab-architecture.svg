<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="834" viewBox="0 0 1200 834"><rect width="1200" height="834" fill="#0c1621"/><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#203343" stroke-width=".6"/></pattern></defs><rect width="1200" height="834" fill="url(#grid)"/><g font-family="sans-serif"><text x="65" y="83" fill="#a3edf0" font-size="14" letter-spacing="3">JACK COATES / HOMELAB</text><text x="65" y="142" fill="#edf3f5" font-size="42">A place to build. A place to break things.</text><text x="65" y="179" fill="#a6b8c4" font-size="17">Documented architecture · logical relationships, not a network topology map</text><g stroke="#527280" stroke-width="2" fill="none"><path d="M345 350H530V565H345M530 565H810M530 350H810"/><path d="M230 425V490"/></g><g fill="#132330" stroke="#355362"><rect x="65" y="270" width="280" height="155"/><rect x="65" y="490" width="280" height="155"/><rect x="810" y="270" width="325" height="155"/><rect x="810" y="490" width="325" height="155"/></g><g fill="#edf3f5" font-size="28"><text x="90" y="330">OPNsense</text><text x="90" y="550">Proxmox</text><text x="835" y="330">Raspberry Pis</text><text x="835" y="550">Public VPS</text></g><g fill="#a6b8c4" font-size="17"><text x="90" y="366">Firewall / CrowdSec</text><text x="90" y="394">Suricata · detect only</text><text x="90" y="586">VMs / LXC / k3s</text><text x="90" y="614">Physical mini PCs</text><text x="835" y="366">Automation &amp; services</text><text x="835" y="394">Part of the homelab</text><text x="835" y="586">Production applications</text><text x="835" y="614">CrowdSec / nginx</text></g><circle cx="530" cy="350" r="6" fill="#a3edf0"/><circle cx="530" cy="565" r="6" fill="#f4b889"/><path d="M65 710H1135" stroke="#355362"/><text x="65" y="754" fill="#a6b8c4" font-size="14">Based on the existing project inventory and verified security sources.</text><text x="65" y="781" fill="#a6b8c4" font-size="14">Private endpoints and internal service details intentionally omitted.</text></g></svg>
